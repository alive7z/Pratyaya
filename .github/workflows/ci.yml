name: CI

on:
  push:
    branches: ["**"]
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    name: Format, lint, test, Atlas integration, build
    runs-on: ubuntu-latest
    env:
      NODE_ENV: test
      LOG_LEVEL: silent
      MONGODB_URI: ${{ secrets.MONGODB_URI }}
      PROVIDER_MONGODB_URI: ${{ secrets.PROVIDER_MONGODB_URI }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Check formatting
        run: npm run format:check

      - name: Lint
        run: npm run lint

      - name: Unit tests
        run: npm test

      - name: Verify Atlas connectivity and transaction rollback
        if: ${{ env.MONGODB_URI != '' && env.PROVIDER_MONGODB_URI != '' }}
        run: npm run db:check

      - name: Integration tests (Atlas replica sets)
        if: ${{ env.MONGODB_URI != '' && env.PROVIDER_MONGODB_URI != '' }}
        run: npm run test:integration

      - name: Build web app
        run: npm run build
