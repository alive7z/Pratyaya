openapi: 3.1.0
info:
  title: Pratyaya API
  version: 0.1.0
  description: |
    API for Pratyaya, a synthetic payment reliability and agentic authorization lab.

    **Simulation only.** Pratyaya does not process real money, cards, bank accounts,
    or personal payment data. Financial journal posting is internal-only; merchant
    clients receive read-only ledger and integrity APIs. Authentication uses HttpOnly cookies with
    CSRF double-submit protection; `Authorization: Bearer` is also accepted for
    API clients.
  contact:
    name: Pratyaya project
servers:
  - url: http://localhost:4000/api/v1
    description: Local API
tags:
  - name: Health
    description: Process and dependency health
  - name: Auth
    description: Registration, login, session rotation, and current identity
  - name: Demo
    description: Credential-free synthetic sandbox sessions
  - name: Dashboards
    description: Role-scoped synthetic dashboard data
  - name: Audit
    description: Append-only audit records scoped by role and merchant
  - name: Payments
    description: Merchant-scoped payment creation, reads, timeline, and cancellation
  - name: Ledger
    description: Merchant-scoped immutable journal, balance, and integrity views
  - name: Reconciliation
    description: Read-only synthetic reconciliation diagnostics
paths:
  /health/live:
    get:
      tags: [Health]
      operationId: getLiveness
      summary: Process liveness
      description: Returns 200 when the API process is running. Does not check MongoDB.
      security: []
      responses:
        "200":
          description: API process is alive
          headers:
            X-Request-ID:
              $ref: "#/components/headers/RequestId"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LivenessResponse"
  /health/ready:
    get:
      tags: [Health]
      operationId: getReadiness
      summary: Dependency readiness
      description: |
        Checks MongoDB with an administrative `ping` using a bounded timeout.
        Returns 503 when the authoritative database is unavailable.
      security: []
      responses:
        "200":
          description: All required dependencies are reachable
          headers:
            X-Request-ID:
              $ref: "#/components/headers/RequestId"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ReadinessResponse"
        "503":
          description: At least one required dependency is unavailable
          headers:
            X-Request-ID:
              $ref: "#/components/headers/RequestId"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ReadinessResponse"
  /system/info:
    get:
      tags: [Health]
      operationId: getSystemInfo
      summary: Non-secret system information
      description: Returns runtime, milestone, and capability metadata without configuration secrets.
      security: []
      responses:
        "200":
          description: Public system metadata
          content:
            application/json:
              schema:
                type: object
  /demo/roles:
    get:
      tags: [Demo]
      operationId: listDemoRoles
      summary: List allowlisted demo roles
      description: Returns the credential-free sandbox roles and the simulation-only notice.
      security: []
      responses:
        "200":
          description: Demo roles
          content:
            application/json:
              schema:
                type: object
                required: [data, meta]
                properties:
                  data:
                    type: object
                  meta:
                    $ref: "#/components/schemas/Meta"
        "429":
          $ref: "#/components/responses/TooManyRequests"
  /demo/session:
    post:
      tags: [Demo]
      operationId: createDemoSession
      summary: Create a credential-free demo session
      description: |
        Creates or reuses an isolated synthetic merchant and session for an allowlisted
        demo role. Sets the same HttpOnly access/refresh and readable CSRF cookies as
        normal authentication. Demo data is read-only and rate limited.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [role]
              properties:
                role:
                  type: string
                  enum: [MERCHANT, ADMIN, DEVELOPER, RISK_ANALYST]
      responses:
        "201":
          description: Demo session created
          headers:
            Set-Cookie:
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthResponse"
        "422":
          $ref: "#/components/responses/ValidationError"
        "429":
          $ref: "#/components/responses/TooManyRequests"
  /auth/register:
    post:
      tags: [Auth]
      operationId: register
      summary: Register a user and merchant membership
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [displayName, email, password, merchantName]
              properties:
                displayName:
                  type: string
                  minLength: 2
                  maxLength: 80
                email:
                  type: string
                  format: email
                password:
                  type: string
                  minLength: 12
                  maxLength: 128
                merchantName:
                  type: string
                  minLength: 2
                  maxLength: 120
      responses:
        "201":
          description: Account and session created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthResponse"
        "409":
          $ref: "#/components/responses/Conflict"
        "422":
          $ref: "#/components/responses/ValidationError"
        "429":
          $ref: "#/components/responses/TooManyRequests"
  /auth/login:
    post:
      tags: [Auth]
      operationId: login
      summary: Authenticate and create a session
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [email, password]
              properties:
                email:
                  type: string
                  format: email
                password:
                  type: string
                  minLength: 1
                  maxLength: 128
      responses:
        "200":
          description: Session established
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "422":
          $ref: "#/components/responses/ValidationError"
        "429":
          $ref: "#/components/responses/TooManyRequests"
  /auth/refresh:
    post:
      tags: [Auth]
      operationId: refreshSession
      summary: Rotate the refresh token
      description: Requires the HttpOnly refresh cookie and the CSRF header/cookie pair.
      security:
        - cookieAuth: []
      parameters:
        - $ref: "#/components/parameters/CsrfToken"
      responses:
        "200":
          description: New access and refresh cookies issued
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
  /auth/logout:
    post:
      tags: [Auth]
      operationId: logout
      summary: Revoke the current session
      security:
        - cookieAuth: []
      parameters:
        - $ref: "#/components/parameters/CsrfToken"
      responses:
        "200":
          description: Session revoked and cookies cleared
          content:
            application/json:
              schema:
                type: object
                required: [data, meta]
                properties:
                  data:
                    type: object
                  meta:
                    $ref: "#/components/schemas/Meta"
        "403":
          $ref: "#/components/responses/Forbidden"
  /auth/me:
    get:
      tags: [Auth]
      operationId: getCurrentIdentity
      summary: Current user, membership, and permissions
      security:
        - cookieAuth: []
        - bearerAuth: []
      responses:
        "200":
          description: Current identity
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
  /dashboard/merchant:
    get:
      tags: [Dashboards]
      operationId: getMerchantDashboard
      summary: Merchant dashboard
      description: Requires the merchant dashboard permission and merchant membership scope.
      security:
        - cookieAuth: []
        - bearerAuth: []
      responses:
        "200":
          $ref: "#/components/responses/DataResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
  /dashboard/admin:
    get:
      tags: [Dashboards]
      operationId: getAdminDashboard
      summary: Admin dashboard (demo sandbox only)
      security:
        - cookieAuth: []
        - bearerAuth: []
      responses:
        "200":
          $ref: "#/components/responses/DataResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
  /dashboard/developer:
    get:
      tags: [Dashboards]
      operationId: getDeveloperDashboard
      summary: Developer dashboard
      security:
        - cookieAuth: []
        - bearerAuth: []
      responses:
        "200":
          $ref: "#/components/responses/DataResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
  /dashboard/risk:
    get:
      tags: [Dashboards]
      operationId: getRiskDashboard
      summary: Risk analyst dashboard
      security:
        - cookieAuth: []
        - bearerAuth: []
      responses:
        "200":
          $ref: "#/components/responses/DataResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
  /audit-logs:
    get:
      tags: [Audit]
      operationId: listAuditLogs
      summary: List scoped audit records
      security:
        - cookieAuth: []
        - bearerAuth: []
      parameters:
        - in: query
          name: limit
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 50
      responses:
        "200":
          $ref: "#/components/responses/DataResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
  /payments:
    get:
      tags: [Payments]
      operationId: listPayments
      summary: List merchant-scoped payments
      security: [{ cookieAuth: [] }, { bearerAuth: [] }]
      parameters:
        - in: query
          name: status
          schema: { type: string }
        - in: query
          name: limit
          schema: { type: integer, minimum: 1, maximum: 100, default: 20 }
        - in: query
          name: from
          schema: { type: string, format: date-time }
        - in: query
          name: to
          schema: { type: string, format: date-time }
      responses:
        "200": { $ref: "#/components/responses/DataResponse" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
    post:
      tags: [Payments]
      operationId: createPayment
      summary: Create a synthetic payment idempotently
      security: [{ cookieAuth: [] }, { bearerAuth: [] }]
      parameters:
        - $ref: "#/components/parameters/CsrfToken"
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [amountMinor, currency]
              properties:
                amountMinor:
                  type: string
                  description: Positive decimal string of integer minor units
                  example: "129900"
                currency:
                  type: string
                  enum: [USD, INR]
                description: { type: string, maxLength: 500 }
                customerReference: { type: string, maxLength: 120 }
                merchantReference: { type: string, maxLength: 100 }
                metadata: { type: object }
      responses:
        "201": { $ref: "#/components/responses/DataResponse" }
        "400": { $ref: "#/components/responses/ValidationError" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "409": { $ref: "#/components/responses/Conflict" }
        "422": { $ref: "#/components/responses/ValidationError" }
  /payments/summary:
    get:
      tags: [Payments]
      operationId: getPaymentSummary
      summary: Get merchant payment counts and amounts
      security: [{ cookieAuth: [] }, { bearerAuth: [] }]
      responses:
        "200": { $ref: "#/components/responses/DataResponse" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
  /payments/{paymentId}:
    get:
      tags: [Payments]
      operationId: getPayment
      summary: Get one merchant-scoped payment
      security: [{ cookieAuth: [] }, { bearerAuth: [] }]
      parameters:
        - {
            in: path,
            name: paymentId,
            required: true,
            schema: { type: string },
          }
      responses:
        "200": { $ref: "#/components/responses/DataResponse" }
        "404": { $ref: "#/components/responses/NotFound" }
  /payments/{paymentId}/timeline:
    get:
      tags: [Payments]
      operationId: getPaymentTimeline
      summary: Get the append-only payment event timeline
      security: [{ cookieAuth: [] }, { bearerAuth: [] }]
      parameters:
        - {
            in: path,
            name: paymentId,
            required: true,
            schema: { type: string },
          }
      responses:
        "200": { $ref: "#/components/responses/DataResponse" }
        "404": { $ref: "#/components/responses/NotFound" }
  /payments/{paymentId}/cancel:
    post:
      tags: [Payments]
      operationId: cancelPayment
      summary: Cancel a payment in an allowed pre-capture state
      security: [{ cookieAuth: [] }, { bearerAuth: [] }]
      parameters:
        - {
            in: path,
            name: paymentId,
            required: true,
            schema: { type: string },
          }
        - $ref: "#/components/parameters/CsrfToken"
        - $ref: "#/components/parameters/IdempotencyKey"
      responses:
        "200": { $ref: "#/components/responses/DataResponse" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "409": { $ref: "#/components/responses/Conflict" }
        "404": { $ref: "#/components/responses/NotFound" }
  /ledger/accounts:
    get:
      tags: [Ledger]
      operationId: listLedgerAccounts
      summary: List merchant ledger accounts with derived balances
      security: [{ cookieAuth: [] }, { bearerAuth: [] }]
      parameters:
        - in: query
          name: currency
          schema: { type: string, enum: [USD, INR] }
        - in: query
          name: page
          schema: { type: integer, minimum: 1, default: 1 }
        - in: query
          name: limit
          schema: { type: integer, minimum: 1, maximum: 100, default: 20 }
      responses:
        "200": { $ref: "#/components/responses/DataResponse" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
  /ledger/accounts/{accountId}:
    get:
      tags: [Ledger]
      operationId: getLedgerAccount
      summary: Get a merchant ledger account and derived balance
      security: [{ cookieAuth: [] }, { bearerAuth: [] }]
      parameters:
        - {
            in: path,
            name: accountId,
            required: true,
            schema: { type: string },
          }
      responses:
        "200": { $ref: "#/components/responses/DataResponse" }
        "404": { $ref: "#/components/responses/NotFound" }
  /ledger/accounts/{accountId}/entries:
    get:
      tags: [Ledger]
      operationId: listLedgerAccountEntries
      summary: List journal-entry projections affecting an account
      security: [{ cookieAuth: [] }, { bearerAuth: [] }]
      parameters:
        - {
            in: path,
            name: accountId,
            required: true,
            schema: { type: string },
          }
      responses:
        "200": { $ref: "#/components/responses/DataResponse" }
  /ledger/journals:
    get:
      tags: [Ledger]
      operationId: listLedgerJournals
      summary: List immutable posted journals
      security: [{ cookieAuth: [] }, { bearerAuth: [] }]
      parameters:
        - in: query
          name: currency
          schema: { type: string, enum: [USD, INR] }
        - in: query
          name: eventType
          schema: { type: string, enum: [CAPTURE, REFUND, REVERSAL] }
        - in: query
          name: accountId
          schema: { type: string }
        - in: query
          name: search
          description: Matches journal reference or source event ID
          schema: { type: string, maxLength: 100 }
        - in: query
          name: from
          schema: { type: string, format: date-time }
        - in: query
          name: to
          schema: { type: string, format: date-time }
        - in: query
          name: page
          schema: { type: integer, minimum: 1, default: 1 }
        - in: query
          name: limit
          schema: { type: integer, minimum: 1, maximum: 100, default: 20 }
      responses:
        "200": { $ref: "#/components/responses/DataResponse" }
  /ledger/journals/{journalId}:
    get:
      tags: [Ledger]
      operationId: getLedgerJournal
      summary: Get a complete immutable journal
      security: [{ cookieAuth: [] }, { bearerAuth: [] }]
      parameters:
        - {
            in: path,
            name: journalId,
            required: true,
            schema: { type: string },
          }
      responses:
        "200": { $ref: "#/components/responses/DataResponse" }
        "404": { $ref: "#/components/responses/NotFound" }
  /ledger/balances:
    get:
      tags: [Ledger]
      operationId: getLedgerBalances
      summary: Get balances derived from posted journals
      security: [{ cookieAuth: [] }, { bearerAuth: [] }]
      responses:
        "200": { $ref: "#/components/responses/DataResponse" }
  /ledger/trial-balance:
    get:
      tags: [Ledger]
      operationId: getTrialBalance
      summary: Get per-currency debit and credit totals
      security: [{ cookieAuth: [] }, { bearerAuth: [] }]
      responses:
        "200": { $ref: "#/components/responses/DataResponse" }
  /ledger/integrity/check:
    post:
      tags: [Ledger]
      operationId: runLedgerIntegrityCheck
      summary: Run authorized read-only integrity checks
      security: [{ cookieAuth: [] }, { bearerAuth: [] }]
      parameters:
        - $ref: "#/components/parameters/CsrfToken"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                currency: { type: string, enum: [USD, INR] }
      responses:
        "201": { $ref: "#/components/responses/DataResponse" }
        "403": { $ref: "#/components/responses/Forbidden" }
  /ledger/integrity/reports:
    get:
      tags: [Ledger]
      operationId: listLedgerIntegrityReports
      summary: List previous integrity reports
      security: [{ cookieAuth: [] }, { bearerAuth: [] }]
      parameters:
        - in: query
          name: currency
          schema: { type: string, enum: [USD, INR] }
        - in: query
          name: page
          schema: { type: integer, minimum: 1, default: 1 }
        - in: query
          name: limit
          schema: { type: integer, minimum: 1, maximum: 100, default: 20 }
      responses:
        "200": { $ref: "#/components/responses/DataResponse" }
  /ledger/integrity/reports/{reportId}:
    get:
      tags: [Ledger]
      operationId: getLedgerIntegrityReport
      summary: Get integrity report findings
      security: [{ cookieAuth: [] }, { bearerAuth: [] }]
      parameters:
        - { in: path, name: reportId, required: true, schema: { type: string } }
      responses:
        "200": { $ref: "#/components/responses/DataResponse" }
  /reconciliation:
    get:
      tags: [Reconciliation]
      operationId: listReconciliationRecords
      summary: List merchant-scoped synthetic reconciliation records
      security: [{ cookieAuth: [] }, { bearerAuth: [] }]
      parameters:
        - in: query
          name: status
          schema:
            type: string
            enum:
              [
                MATCHED,
                MISSING_INTERNAL_RECORD,
                MISSING_PROVIDER_RECORD,
                AMOUNT_MISMATCH,
                STATUS_MISMATCH,
                PENDING_REVIEW,
                RESOLVED,
              ]
        - in: query
          name: page
          schema: { type: integer, minimum: 1, default: 1 }
        - in: query
          name: limit
          schema: { type: integer, minimum: 1, maximum: 100, default: 20 }
      responses:
        "200": { $ref: "#/components/responses/DataResponse" }
  /reconciliation/{recordId}:
    get:
      tags: [Reconciliation]
      operationId: getReconciliationRecord
      summary: Get reconciliation diagnostic details
      security: [{ cookieAuth: [] }, { bearerAuth: [] }]
      parameters:
        - { in: path, name: recordId, required: true, schema: { type: string } }
      responses:
        "200": { $ref: "#/components/responses/DataResponse" }
        "404": { $ref: "#/components/responses/NotFound" }
components:
  securitySchemes:
    cookieAuth:
      type: apiKey
      in: cookie
      name: pratyaya_access
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  parameters:
    CsrfToken:
      in: header
      name: X-CSRF-Token
      required: true
      description: Must match the readable `pratyaya_csrf` cookie.
      schema:
        type: string
    IdempotencyKey:
      in: header
      name: Idempotency-Key
      required: true
      description: Unique per merchant and operation; paired with a canonical request fingerprint.
      schema:
        type: string
        minLength: 8
        maxLength: 200
  responses:
    Unauthorized:
      description: Authentication is missing, expired, or invalid
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    Forbidden:
      description: Authenticated identity lacks permission or CSRF validation failed
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    Conflict:
      description: The requested resource conflicts with existing state
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    NotFound:
      description: Merchant-scoped resource was not found
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    ValidationError:
      description: Request validation failed
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    TooManyRequests:
      description: Rate limit exceeded
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    DataResponse:
      description: Successful data response
      content:
        application/json:
          schema:
            type: object
            required: [data, meta]
            properties:
              data:
                type: object
              meta:
                $ref: "#/components/schemas/Meta"
  headers:
    RequestId:
      description: Correlation identifier generated or normalized by the API
      schema:
        type: string
        minLength: 8
        maxLength: 128
  schemas:
    Meta:
      type: object
      required: [requestId, timestamp]
      properties:
        requestId:
          type: string
        timestamp:
          type: string
          format: date-time
    DependencyCheck:
      type: object
      required: [status, latencyMs]
      properties:
        status:
          type: string
          enum: [up, down]
        latencyMs:
          type: integer
          minimum: 0
        code:
          type: string
          enum: [DATABASE_UNAVAILABLE]
    HealthChecks:
      type: object
      required: [database]
      properties:
        database:
          $ref: "#/components/schemas/DependencyCheck"
    Liveness:
      type: object
      required: [status, service, version, uptimeSeconds, timestamp]
      properties:
        status:
          type: string
          enum: [ok]
        service:
          type: string
          example: pratyaya-api
        version:
          type: string
          example: 0.1.0
        uptimeSeconds:
          type: integer
          minimum: 0
        timestamp:
          type: string
          format: date-time
    Readiness:
      type: object
      required: [status, service, version, checks, timestamp]
      properties:
        status:
          type: string
          enum: [ready, not_ready]
        service:
          type: string
          example: pratyaya-api
        version:
          type: string
          example: 0.1.0
        checks:
          $ref: "#/components/schemas/HealthChecks"
        timestamp:
          type: string
          format: date-time
    LivenessResponse:
      type: object
      required: [data, meta]
      properties:
        data:
          $ref: "#/components/schemas/Liveness"
        meta:
          $ref: "#/components/schemas/Meta"
    ReadinessResponse:
      type: object
      required: [data, meta]
      properties:
        data:
          $ref: "#/components/schemas/Readiness"
        meta:
          $ref: "#/components/schemas/Meta"
    Error:
      type: object
      required: [code, message]
      properties:
        code:
          type: string
          example: NOT_FOUND
        message:
          type: string
        details:
          description: Optional structured validation details
    ErrorResponse:
      type: object
      required: [error, meta]
      properties:
        error:
          $ref: "#/components/schemas/Error"
        meta:
          $ref: "#/components/schemas/Meta"
    AuthResponse:
      type: object
      required: [data, meta]
      properties:
        data:
          type: object
          required:
            [
              user,
              membership,
              session,
              permissions,
              accessToken,
              tokenType,
              csrfToken,
            ]
          properties:
            user:
              type: object
            membership:
              type: object
            session:
              type: object
            permissions:
              type: array
              items:
                type: string
            accessToken:
              type: string
            tokenType:
              type: string
              enum: [Bearer]
            csrfToken:
              type: string
        meta:
          $ref: "#/components/schemas/Meta"
